<style>

  .brand b{display:block;font-size:16px;color:var(--navy);letter-spacing:.02em}
  .brand span{font-size:12px;color:var(--muted)}
  .views{pointer-events:auto;margin-left:auto;display:flex;gap:6px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 4px 18px rgba(16,24,40,.08)}
  .views button{border:0;background:transparent;border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap}
  .views button[aria-pressed="true"]{background:var(--navy);color:#fff}
  .views .back{display:inline-flex;align-items:center;border-radius:10px;padding:8px 12px;font-size:14px;white-space:nowrap;text-decoration:none;background:#eef2f8;color:var(--navy);font-weight:600}

    .views .back{flex:1;justify-content:center;padding:8px 6px}

    box-shadow:0 10px 36px rgba(16,24,40,.2);transition:opacity .3s,transform .3s}
  .guide.off{opacity:0;transform:translate(-50%,24px);pointer-events:none}
  .guide b{font-size:14px;color:var(--navy)}

  .guide i{font-style:normal;font-size:20px;color:var(--navy);flex:none;width:24px;text-align:center}

  .drawer .body{overflow:auto;padding:8px 10px 24px;flex:1}
  .drawer h3{font-size:12px;color:var(--muted);margin:14px 8px 6px;font-weight:600;letter-spacing:.08em}

  .row .sub{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .shots img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-bottom:8px;background:#f3f4f6}
  .nav2{display:flex;gap:8px;margin-top:6px}

  .rb:active,.rb.on{background:var(--navy);color:#fff}
  .padOld{position:fixed;z-index:5;left:calc(12px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:6px;

  .pad [data-d=f]{grid-area:f}.pad [data-d=b]{grid-area:b}.pad [data-d=l]{grid-area:l}.pad [data-d=r]{grid-area:r}
  .side{position:fixed;z-index:5;right:calc(12px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}

  .side .rb small{display:block;font-size:10px;font-weight:600;margin-top:1px}
  .dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;max-width:calc(100vw - 340px)}
  .chips2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px}
  .chips2::-webkit-scrollbar{display:none}

  .chips2 button b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;margin-right:6px}

  .ztoast{position:fixed;z-index:6;left:50%;transform:translateX(-50%) translateY(8px);bottom:calc(146px + env(safe-area-inset-bottom));background:rgba(23,51,107,.92);color:#fff;font-weight:700;font-size:16px;
    padding:8px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}

  .err{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center;z-index:30;background:#dfe3e8}
</style>
</head>

const shadowGeo = new THREE.CircleGeometry(1, 24), shadowMat = new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:.26, depthWrite:false });
function board(src, h, opt={}) {
  const g = new THREE.Group(), m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({ transparent:true, alphaTest:.35, side:THREE.DoubleSide, color:0xf4f4f4 }));

  o.face = (cam, vx, vz) => {                                    // 面向鏡頭；走路時依螢幕上的左右方向翻轉（原圖朝左）
    m.rotation.y = Math.atan2(cam.position.x - g.position.x, cam.position.z - g.position.z);

/* ───────── 3D 人偶骨架：模型沒有骨架，載入後自己依手臂、雙腿、頭的區域做簡單動作（走路、揮手、抬頭） ───────── */
function makeRig(m, url, K, cfg = {}) {
  const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
  const rot = (a, b, c, s, px, py) => { const x = a-px, y = b-py; return [px + x*c - y*s, py + x*s + y*c]; };
  const r = { ready:false }, lo = cfg.armLo || .27, hi = cfg.armHi || .36;
  let pos, base, armI = [], armW = [], forW = [], legI = [], legW = [], legS = [], headI = [], headW = [], jawW = [];
  new THREE.GLTFLoader().load(A + url, gl => {
    let mesh; gl.scene.traverse(n => { if (n.isMesh && !mesh) mesh = n; });
    mesh.material = new THREE.MeshBasicMaterial({ map: mesh.material.map, color: cfg.tint || 0xffffff });
    mesh.scale.setScalar(K); mesh.position.y = .952*K; m.add(mesh);
    pos = mesh.geometry.attributes.position; base = Float32Array.from(pos.array);
    for (let i = 0; i < pos.count; i++) {
      const x = base[i*3], y = base[i*3+1];
      const aw = cfg.suit ? ss(.22, .28, Math.abs(x)) * ss(.56, .44, y) : ss(lo, hi, Math.abs(x)) * ss(.62, .5, y);   // 離開軀幹的部分才算手臂（左右兩側）；suit：手臂垂在身側的西裝人偶
      if (aw > .001) { armI.push(i); armW.push(aw); forW.push(cfg.suit ? ss(.38, .26, y) : ss(.28, .4, (Math.abs(x)-.3)*.34 + (.45-y)*.94)); }   // 沿手臂方向超過手肘的部分算前臂
      const hw = ss(.56, .68, y); if (hw > .001) { headI.push(i); headW.push(hw); jawW.push(ss(.748, .736, y) * ss(-.02, .04, base[i*3+2]) * ss(.19, .13, Math.abs(x))); }   // 脖子以上算頭，用來抬頭看鏡頭
      const lw = ss(-.42, -.52, y);
      if (lw > .001) { legI.push(i); legW.push(lw); legS.push(ss(-.04, .04, x)); }
    }
    if (cfg.suit) { let by = 9; for (let k = 0; k < armI.length; k++) { const i = armI[k]; if (base[i*3]*cfg.mic > 0 && armW[k] > .99 && base[i*3+1] < by) { by = base[i*3+1]; r.hand = i; } } }   // 手掌最低的點：拿麥克風的位置
    r.ready = true;
  });
  r.handPos = v => { const i = r.hand*3, a = pos.array; return v.set(a[i]*K, a[i+1]*K + .952*K, a[i+2]*K); };
  // walk：走路程度 0–1；ph：步伐相位；up：舉手程度 0–1；t：揮手計時；pitch：抬頭角度；ws：舉哪一側的手（1 = 模型 x>0 側）
  r.pose = (walk, ph, up, t, pitch, ws = 1, jaw = 0) => {
    if (!r.ready) return; const arr = pos.array, sw = Math.sin(ph), L = .5*walk*sw;
    const cl = Math.cos(L), sl = Math.sin(L), cr = Math.cos(-L), sr = Math.sin(-L);
    const kk = -ws, rotUp = -1.0*up*kk, wv = (-1.05 + .25*Math.sin(t*7))*up*kk;
    const cu = Math.cos(rotUp), su = Math.sin(rotUp), ax = .38*walk*sw;
    for (let k = 0; k < legI.length; k++) {
      const i = legI[k]*3, y = base[i+1], z = base[i+2], w = legW[k], a = legS[k] > .5 ? [cl, sl] : [cr, sr];
      const yz = rot(y, z, a[0], a[1], -.47, 0); arr[i] = base[i]; arr[i+1] = y + w*(yz[0]-y); arr[i+2] = z + w*(yz[1]-z);
    }
    for (let k = 0; k < armI.length; k++) {
      const i = armI[k]*3, x = base[i], y = base[i+1], z = base[i+2], w = armW[k], f = forW[k];
      let tx = x, ty = y, tz = z;
      if (cfg.suit) {   // 手臂貼著身體（模型沒有張開手臂）：整隻手臂以肩膀為軸往前抬、前後擺動，不往外張（往外會把袖子撕開）
        if (x*ws > 0 && up > 0) { const a = (-1.0 + .2*Math.sin(t*7))*up, u = rot(ty, tz, Math.cos(a), Math.sin(a), .5, 0); ty = u[0]; tz = u[1]; }
      } else if (x*ws > 0) {
        if (up > 0) { const e = rot(tx, ty, Math.cos(wv*f), Math.sin(wv*f), ws*.4, .17); tx = e[0]; ty = e[1];
          const q = rot(tx, ty, cu, su, ws*.3, .45); tx = q[0]; ty = q[1]; }
        const s2 = rot(ty, tz, Math.cos(ax*(1-up)), Math.sin(ax*(1-up)), .45, 0); ty = s2[0]; tz = s2[1];
      } else { const s2 = rot(ty, tz, Math.cos(-ax), Math.sin(-ax), .45, 0); ty = s2[0]; tz = s2[1]; }
      arr[i] = x + w*(tx-x); arr[i+1] = y + w*(ty-y); arr[i+2] = z + w*(tz-z);
    }
    const cp = Math.cos(-pitch), sp = Math.sin(-pitch);                       // 頭往上抬（臉朝 +z，抬頭＝負角度）
    for (let k = 0; k < headI.length; k++) {
      const i = headI[k]*3; let y = base[i+1], z = base[i+2], w = headW[k];
      if (jaw > 0 && jawW[k] > .001) { y -= jaw*.06*jawW[k]; z -= jaw*.02*jawW[k]; }   // 下唇與下巴往下、微微往後：嘴巴張開
      const q = rot(y, z, cp, sp, .6, 0);
      arr[i] = base[i]; arr[i+1] = base[i+1] + w*(q[0]-base[i+1]) + (1-w)*(y-base[i+1]); arr[i+2] = base[i+2] + w*(q[1]-base[i+2]) + (1-w)*(z-base[i+2]);
    }
    pos.needsUpdate = true;
  };
  return r;
}
